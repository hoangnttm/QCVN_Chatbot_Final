# Tier M — multi-hop questions (plan docs/plans/2026-09-29-graph-ppr-path-verification.md §4.6, PO D32).
#
# Every item = one table cell read from the raw source (rawtables.py, as tier A) + one or more "hops":
# a clause of another part of the corpus that the answer cannot be given without. Hops are written
# here by hand from the raw files in sources/ (line numbers are whole-file lines, the quote must occur
# in them — gold_multihop.py refuses to generate otherwise). Nothing is taken from Neo4j or the
# parser, so the set does not favour the graph under evaluation. No LLM involved.
