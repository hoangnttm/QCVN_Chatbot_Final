# {param} parameter phrase · {ctx} ", lưu lượng …" / " của lò hơi …" · {zone} column phrase (tier A)
# {zone_desc} definition phrase (ZD)
templates:
  DZ:
    wastewater:
      - {id: dz_w1, text: "Chưa xác định được phân vùng xả thải của cơ sở thì {param} trong nước thải công nghiệp{ctx} tối đa là bao nhiêu?"}
      - {id: dz_w2, text: "Địa phương chưa phân vùng xả thải nước thải. Giới hạn {param}{ctx} áp dụng cho nhà máy là bao nhiêu?"}
      - {id: dz_w3, text: "Nếu chưa biết nguồn tiếp nhận thuộc phân vùng nào, nước thải công nghiệp{ctx} phải đạt {param} ở mức nào?"}
    emission:
      - {id: dz_e1, text: "Chưa xác định được phân vùng môi trường thì {param} trong khí thải{ctx} được phép tối đa bao nhiêu?"}
      - {id: dz_e2, text: "Địa phương chưa có phân vùng môi trường. Giới hạn {param}{ctx} là bao nhiêu?"}
      - {id: dz_e3, text: "Không rõ cơ sở nằm ở vùng nào, khí thải{ctx} phải đạt {param} ở mức nào?"}
  ZD:
    wastewater:
      - {id: zd_w1, text: "Nhà máy {zone_desc}. Giới hạn {param} trong nước thải công nghiệp{ctx} là bao nhiêu?"}
      - {id: zd_w2, text: "Nước thải công nghiệp{ctx} {zone_desc} thì {param} không được vượt quá bao nhiêu?"}
      - {id: zd_w3, text: "Cơ sở {zone_desc}: ngưỡng {param}{ctx} theo QCVN 40:2025 là gì?"}
    emission:
      - {id: zd_e1, text: "Cơ sở {zone_desc}. Giới hạn {param} trong khí thải{ctx} là bao nhiêu?"}
      - {id: zd_e2, text: "Nhà máy {zone_desc} thì {param}{ctx} tối đa bao nhiêu?"}
      - {id: zd_e3, text: "Khí thải{ctx} của cơ sở {zone_desc} phải đạt {param} ở mức nào?"}
  TR:
    wastewater:
      - {id: tr_w1, text: "Cơ sở đã đi vào vận hành trước khi Thông tư 06/2025/TT-BTNMT có hiệu lực. Kể từ ngày 01/01/2032, {param}{ctx} ở {zone} phải đáp ứng mức nào?"}
      - {id: tr_w2, text: "Nhà máy đang hoạt động từ trước năm 2025 thì từ 01/01/2032 giới hạn {param} ({zone}{ctx}) là bao nhiêu?"}
    emission:
      - {id: tr_e1, text: "Cơ sở đã đi vào vận hành trước khi Thông tư 45/2024/TT-BTNMT có hiệu lực. Kể từ ngày 01/01/2032, {param}{ctx} ở {zone} phải đáp ứng mức nào?"}
      - {id: tr_e2, text: "Nhà máy đang hoạt động từ trước khi QCVN 19:2024 có hiệu lực thì từ 01/01/2032 giới hạn {param}{ctx} ({zone}) là bao nhiêu?"}
  RP:
    wastewater:
      - {id: rp_w1, text: "QCVN 40:2011/BTNMT về nước thải công nghiệp đã bị thay thế. Theo quy chuẩn thay thế, {param}{ctx}, {zone} là bao nhiêu?"}
      - {id: rp_w2, text: "Tôi vẫn đang dùng QCVN 40:2011/BTNMT. Quy chuẩn nào thay thế nó và giới hạn {param} ({zone}{ctx}) mới là bao nhiêu?"}
  FN_TOC:
    wastewater:
      - {id: fn_t1, text: "Doanh nghiệp chọn áp dụng TOC thay cho COD. Giới hạn TOC trong nước thải công nghiệp{ctx}, {zone} là bao nhiêu?"}
      - {id: fn_t2, text: "Có được dùng chỉ tiêu TOC thay COD không, và nếu dùng thì TOC ({zone}{ctx}) tối đa bao nhiêu?"}
  FN_O2:
    emission:
      - {id: fn_o1, text: "{param} trong khí thải{ctx} ở {zone} tối đa bao nhiêu, và giá trị đó tính theo hàm lượng ôxy tham chiếu nào?"}
      - {id: fn_o2, text: "Giới hạn {param}{ctx} ({zone}) là bao nhiêu? Con số trong ngoặc ở cột này có nghĩa là gì?"}
