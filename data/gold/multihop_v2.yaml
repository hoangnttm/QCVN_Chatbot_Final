# zone described by its definition, never by the column letter (pattern ZD)
zone_descriptions:
  wastewater:
    A:
      - "xả ra nguồn nước tiếp nhận có chức năng cấp nước cho mục đích sinh hoạt"
      - "xả vào nguồn nước được dùng để cấp nước sinh hoạt"
    B:
      - "xả ra nguồn nước tiếp nhận thuộc Mức B theo QCVN 08:2023/BTNMT"
      - "xả vào nguồn nước mặt có mục đích quản lý, cải thiện chất lượng như Mức B của QCVN 08:2023/BTNMT"
    C:
      - "xả ra nguồn nước tiếp nhận không dùng cấp nước sinh hoạt và không thuộc Mức A, Mức B của QCVN 08:2023/BTNMT"
  emission:
    A:
      - "có địa điểm hoạt động trong vùng bảo vệ nghiêm ngặt"
      - "đặt tại vùng bảo vệ nghiêm ngặt"
    B:
      - "có địa điểm hoạt động trong vùng hạn chế phát thải"
      - "nằm trong vùng hạn chế phát thải"
    C:
      - "có địa điểm hoạt động không thuộc vùng bảo vệ nghiêm ngặt hay vùng hạn chế phát thải"

