    document_ids: [TT_06_2025, TT_45_2024, TT_10_2021]
    chunk_types: [clause, point]
  # ---------------------------------------------------------------- B4 — cross-document
  - code: XDOC
    title: Liên văn bản, liên lĩnh vực (cần căn cứ từ hai văn bản)
    group: B4
    quota_dev: 2
    quota_test: 4 # 6 - 2 (PO 2026-10-20: hai câu chuyển sang B3)
  # ---------------------------------------------------------------- B5 — missing facts
  - code: CLARIFY
    title: Thiếu dữ kiện — liệt kê khi tối đa 3 phương án, hỏi lại khi nhiều hơn
    group: B5
    quota_dev: 2
    quota_test: 6
  # ---------------------------------------------------------------- B6 — refusals and traps
  - code: NEG-OOS
    title: Ngoài phạm vi
    group: B6
    domain: out_of_scope
    quota_dev: 4 # 2 migrated + 1 new; +1 D69 a (2026-10-20): G-B6-016 từ test
    quota_test: 2
  - code: FREQ-M01
    title: Tần suất quan trắc — không có trong corpus, chỉ dẫn sang văn bản khác
    group: B6
    quota_dev: 1 # migrated
    quota_test: 2
    chunk_ids:
      - "chunk:TT_10_2021/ChapterIV/Article16/Clause3"
      - "chunk:TT_10_2021/ChapterIV/Article17/Clause5"
  - code: NEG-MISSING
    title: Không có đáp án trong corpus
    group: B6
    quota_dev: 1
    quota_test: 2
  - code: NEG-TRAP
    title: Bẫy — tiền đề sai, injection, hỏi đạt hay không đạt, quy đổi đơn vị, quy chuẩn đã bị thay thế
