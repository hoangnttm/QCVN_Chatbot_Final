  - code: A-TABLES
    title: Tầng A — tra bảng sinh theo mẫu từ nguồn
    tier: A
    group: T1
    tables: [QCVN40_2025.B1, QCVN40_2025.B2, QCVN19_2024.B1, QCVN19_2024.B2]
  - code: C-NATURAL
    title: Tầng C — câu hỏi thật từ nhật ký pilot/UAT
    tier: C
    group: C
  - code: M-DZ
    title: Tầng M — chưa phân vùng → Cột B mặc định + dòng bảng
    tier: M
    group: T2
  - code: M-ZD
    title: Tầng M — vùng mô tả bằng định nghĩa + dòng bảng
    tier: M
    group: T2
  - code: M-TR
    title: Tầng M — lộ trình 01/01/2032 + dòng bảng
    tier: M
    group: T2
  - code: M-RP
    title: Tầng M — QCVN 40:2011 bị thay thế + dòng bảng
    tier: M
    group: T2
  - code: M-FN_TOC
    title: Tầng M — chú thích TOC/COD + dòng TOC
    tier: M
    group: T2
  - code: M-FN_O2
    title: Tầng M — chú thích ôxy tham chiếu + dòng bảng
    tier: M
    group: T2

# Round 1 keeps only the coverage the 80 hand-written items can meet; the full list of
# strata_v2.yaml returns in round 2.
coverage:
  - name: zones_per_domain
    kind: zone
    values: [A, B, C]
    domains: [wastewater, emission]
    min_each: 2
  - name: flow_bands
    kind: flow_band
    values: ["F<=2000", "F>2000"]
    min_each: 1
  - name: frequency
    kind: frequency
    min_total: 3
  - name: traps
    kind: trap
    min_total: 6
