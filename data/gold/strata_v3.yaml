  - code: WW-SECTOR
    title: QCVN 40 Phụ lục 2 — loại hình, thông số đặc trưng
    group: B2
    domain: wastewater
    quota_dev: 0
    quota_test: 2
    tables: [QCVN40_2025.PL2]
  - code: DEF-SCOPE
    title: Định nghĩa và phạm vi áp dụng
    group: B2
    quota_dev: 2
    quota_test: 4
    document_ids: [QCVN_40_2025, QCVN_19_2024, TT_10_2021]
