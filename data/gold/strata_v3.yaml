# Gold set v3, round 1 — strata, quotas and coverage (docs/plans/2026-10-06-xay-lai-bo-cau-hoi.md §0).
# Read by backend/app/evaluation/gold_*.py (validator, authoring kit, split, stats).
#
# `group` is the question group of the plan (B1–B6 hand-written, T1/T2 template). Hand-written
# quotas: dev = items migrated from v2 (13, all dev) + 20 new; test = 60 new. The former test
# split of tiers A and M is now `val` and has no quota.
version: 3
seed: 20261006
paraphrase_max_share: 0.20
paraphrase_max_per_stratum: 2
trap_min: 6

strata:
  # ---------------------------------------------------------------- B1 — thresholds with conditions
  - code: WW-B1-FLOWZONE
    title: QCVN 40 Bảng 1 — dải lưu lượng × cột
    group: B1
    domain: wastewater
    quota_dev: 2 # 1 migrated + 1 new
    quota_test: 2
    tables: [QCVN40_2025.B1]
  - code: WW-B2-PLAIN
    title: QCVN 40 Bảng 2 — dòng thường (khoảng pH, dấu phẩy thập phân, kim loại)
    group: B1
    domain: wastewater
    quota_dev: 1 # migrated
    quota_test: 1
    tables: [QCVN40_2025.B2]
  - code: WW-B2-COND
    title: QCVN 40 Bảng 2 — giá trị theo nguồn tiếp nhận hoặc theo ngành
    group: B1
    domain: wastewater
    quota_dev: 2 # 1 migrated + 1 new
    quota_test: 3
    tables: [QCVN40_2025.B2]
  - code: EM-B1-EQUIP
    title: QCVN 19 Bảng 1/2 — thiết bị × nhiên liệu × công suất × cột
    group: B1
    domain: emission
    quota_dev: 4 # 2 migrated + 2 new
    quota_test: 5
    tables: [QCVN19_2024.B1, QCVN19_2024.B2]
  - code: EM-O2-FOOTNOTE
    title: QCVN 19 — giá trị kèm ôxy tham chiếu
    group: B1
    domain: emission
    quota_dev: 0
    quota_test: 2
