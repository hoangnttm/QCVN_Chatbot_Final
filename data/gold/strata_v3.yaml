    quota_test: 3
    tables: [QCVN40_2025.PL1, QCVN19_2024.PL1, TT10_2021.B25, TT10_2021.B26]
    rule_ids: [TT10.MR.01, TT10.MR.02, TT10.MR.03, TT10.MR.04]
